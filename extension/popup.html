<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Echo360 Downloader</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div class="mark">E</div>
        <div>
          <h1>Echo360 Downloader</h1>
          <p id="subtitle">メディアを確認しています</p>
        </div>
      </header>

      <section id="empty" class="panel hidden">
        <h2>まだメディアが見つかりません</h2>
        <p>Echo360の授業ページで動画を数秒再生してから、もう一度開いてください。</p>
      </section>

      <section id="content" class="hidden">
        <div class="notice">
          一括保存するとCLIが自動認識できるフォルダに映像と音声をまとめます。
        </div>
        <div id="qualities"></div>
      </section>

      <section id="section-content" class="panel hidden">
        <h2>section 一括ダウンロード</h2>
        <p id="section-summary">授業一覧を確認しています…</p>
        <button id="section-download" class="bundle-button" disabled>一覧を全てダウンロード</button>
        <div id="batch-progress" class="hidden">
          <div class="progress-track"><span id="progress-bar"></span></div>
          <p id="progress-text"></p>
          <button id="batch-cancel" class="secondary-button">中止</button>
        </div>
      </section>

      <section id="download-settings" class="panel settings-panel">
        <h2>デフォルト保存先</h2>
        <div class="settings-fields">
          <label for="custom-folder">Chromeのダウンロード先からの相対パス</label>
          <input id="custom-folder" type="text" maxlength="240" placeholder="授業/Echo360" spellcheck="false">
        </div>
        <button id="save-download-settings" class="secondary-button settings-save">設定を保存</button>
        <p id="effective-folder">Chromeの保存先 / Echo360</p>
        <p>ダウンロード開始前に、今回の保存先を確認できます。</p>
        <p>基準フォルダはChromeの設定 → ダウンロード → 保存先で変更できます。</p>
      </section>

      <p id="status" role="status"></p>
      <dialog id="folder-dialog" aria-labelledby="folder-dialog-title">
        <form id="folder-form">
          <h2 id="folder-dialog-title">今回の保存先</h2>
          <div class="settings-fields">
            <label for="confirmed-folder">Chromeのダウンロード先からの相対パス</label>
            <input id="confirmed-folder" type="text" required maxlength="240" spellcheck="false">
          </div>
          <p>変更したパスを次回の初期値として保存します。</p>
          <p id="folder-error" role="alert"></p>
          <div class="dialog-actions">
            <button id="folder-cancel" type="button" class="secondary-button">キャンセル</button>
            <button id="folder-start" type="submit">この保存先で開始</button>
          </div>
        </form>
      </dialog>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
